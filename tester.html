<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate como Tester – Cabrero App</title>
  <meta name="description" content="Únete al testing cerrado de Cabrero App. Inicia sesión con Google para registrarte.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .tester-box {
      max-width: 440px;
      margin: 2rem auto;
      padding: 1.5rem 1.25rem;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin: 1.25rem 0 0.5rem;
    }
    .google-btn:hover { background: #f8f9fa; }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 1.25rem; font-size: 1rem; line-height: 1.45; min-height: 1.5em; }
    .success { color: #1b5e20; font-weight: 500; }
    .error { color: #c62828; }
    .note { font-size: 0.9rem; color: #555; margin: 0.75rem 0; }
    .secondary {
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }
    .secondary a { color: #555; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html"><img src="imagine_images/d5Y8Q.jpg" alt="Cabrero App" class="logo"></a>
      <div class="lang-switch">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="tester-box">
        <h1 data-i18n="testerTitle">Regístrate como Tester</h1>
        <p data-i18n="testerSubtitle">Inicia sesión con Google para unirte al testing cerrado de Cabrero App.</p>
        <p class="note" data-i18n="testerNote">Para probar la app necesitas una cuenta de Google (la misma que ya tienes en tu teléfono Android). Usaremos ese correo para agregarte al testing.</p>

        <div id="status" class="status">Cargando…</div>

        <button id="googleBtn" class="google-btn" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
          <span data-i18n="googleBtn">Continuar con Google</span>
        </button>

        <div class="secondary" id="secondary" style="display:none;">
          <a href="#" id="signOutLink" data-i18n="signOut">Usar otra cuenta</a>
        </div>

        <div style="margin-top: 1.75rem;">
          <button id="closeBtn" class="google-btn" style="background:#f5f5f5; border-color:#ddd;" data-i18n="closeBtn">Cerrar esta página</button>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== CONFIG ==========
    const SUPABASE_URL = 'https://xxwxujiepiitgbmoxwnc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xyAhOd0DPSjzlG-cqnLFPA_fBFDf9TJ';
    // ============================

    const googleBtn = document.getElementById('googleBtn');
    const statusEl = document.getElementById('status');
    const secondaryEl = document.getElementById('secondary');
    const signOutLink = document.getElementById('signOutLink');
    const closeBtn = document.getElementById('closeBtn');

    const texts = {
      es: {
        testerTitle: "Regístrate como Tester",
        testerSubtitle: "Inicia sesión con Google para unirte al testing cerrado de Cabrero App.",
        testerNote: "Para probar la app necesitas una cuenta de Google (la misma que ya tienes en tu teléfono Android). Usaremos ese correo para agregarte al testing.",
        googleBtn: "Continuar con Google",
        closeBtn: "Cerrar esta página",
        loading: "Cargando…",
        working: "Registrándote…",
        success: "¡Listo! Te registramos con el correo<br><strong>{email}</strong><br><br>Te agregaremos al testing de Google Play pronto. Puedes cerrar esta página.",
        already: "Ya estás registrado con<br><strong>{email}</strong><br><br>Te agregaremos al testing pronto.",
        error: "Algo salió mal. Intenta de nuevo o escríbenos por WhatsApp.",
        configError: "Configuración pendiente. Contacta al equipo.",
        timeout: "La conexión está tardando demasiado. Revisa tu internet e intenta de nuevo.",
        clientError: "No se pudo cargar el sistema de registro. Recarga la página.",
        signOut: "Usar otra cuenta",
        closeFallback: "Si el botón no cierra la pestaña, ciérrala tú mismo."
      },
      en: {
        testerTitle: "Register as Tester",
        testerSubtitle: "Sign in with Google to join the Cabrero App closed testing.",
        testerNote: "To try the app you need a Google account (the same one already on your Android phone). We will use that email to add you to testing.",
        googleBtn: "Continue with Google",
        loading: "Loading…",
        working: "Registering you…",
        success: "Done! We registered you with<br><strong>{email}</strong><br><br>We will add you to Google Play testing soon. You can close this page.",
        already: "You are already registered with<br><strong>{email}</strong><br><br>We will add you to testing soon.",
        error: "Something went wrong. Please try again or contact us on WhatsApp.",
        configError: "Configuration pending. Contact the team.",
        timeout: "The connection is taking too long. Check your internet and try again.",
        clientError: "Could not load the registration system. Please reload the page.",
        signOut: "Use a different account",
        closeFallback: "If the button doesn’t close the tab, close it yourself."
      }
    };

    const lang = localStorage.getItem('cabrero-lang') || 'es';
    let currentLang = lang;

    function getT() {
      return texts[currentLang] || texts.es;
    }

    let lastEmail = null;
    let lastStatusType = null; // 'success' | 'error' | etc.

    function renderStatus() {
      if (!lastStatusType) return;
      const tr = getT();
      if (lastStatusType === 'success' && lastEmail) {
        statusEl.innerHTML = `<span class="success">${tr.success.replace('{email}', lastEmail)}</span>`;
      } else if (lastStatusType === 'error') {
        statusEl.innerHTML = `<span class="error">${tr.error}</span>`;
      }
    }

    function applyLanguage(newLang) {
      currentLang = newLang;
      const tr = getT();
      document.documentElement.lang = currentLang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (tr[key]) el.textContent = tr[key];
      });
      document.querySelectorAll('.lang-switch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
      localStorage.setItem('cabrero-lang', currentLang);
      renderStatus();
    }

    applyLanguage(currentLang);

    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    function showButton() {
      googleBtn.style.display = 'inline-flex';
      googleBtn.disabled = false;
    }

    function hideButton() {
      googleBtn.style.display = 'none';
    }

    function withTimeout(promise, ms = 8000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
    }

    let supabaseClient = null;

    async function registerTester(session) {
      const email = session.user.email;
      const userId = session.user.id;

      statusEl.innerHTML = getT().working;

      try {
        const { error } = await withTimeout(
          supabaseClient.from('beta_testers').upsert({
            email,
            user_id: userId,
            source: 'promo-site'
          }, { onConflict: 'email' })
        );

        if (error) {
          console.error('beta_testers upsert error:', error);
          statusEl.innerHTML = `<span class="error">${getT().error}</span>`;
          lastStatusType = 'error';
          secondaryEl.style.display = 'block';
          return;
        }

        statusEl.innerHTML = `<span class="success">${getT().success.replace('{email}', email)}</span>`;
        lastEmail = email;
        lastStatusType = 'success';
        hideButton();
        secondaryEl.style.display = 'block';
      } catch (e) {
        console.error(e);
        statusEl.innerHTML = `<span class="error">${e.message === 'timeout' ? getT().timeout : getT().error}</span>`;
        secondaryEl.style.display = 'block';
      }
    }

    async function init() {
      statusEl.textContent = getT().loading;

      if (!window.supabase) {
        statusEl.innerHTML = `<span class="error">${getT().clientError}</span>`;
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        console.error(e);
        statusEl.innerHTML = `<span class="error">${getT().clientError}</span>`;
        return;
      }

      try {
        const { data: { session }, error } = await withTimeout(supabaseClient.auth.getSession());

        if (error) {
          console.error(error);
          statusEl.innerHTML = `<span class="error">${getT().error}</span>`;
          showButton();
          return;
        }

        if (session?.user?.email) {
          await registerTester(session);
        } else {
          statusEl.textContent = '';
          showButton();
        }
      } catch (e) {
        console.error(e);
        statusEl.innerHTML = `<span class="error">${e.message === 'timeout' ? getT().timeout : getT().error}</span>`;
        showButton();
      }
    }

    googleBtn.addEventListener('click', async () => {
      if (!supabaseClient) return;
      statusEl.textContent = getT().working;
      googleBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });

        if (error) {
          console.error(error);
          statusEl.innerHTML = `<span class="error">${getT().error}</span>`;
          googleBtn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        statusEl.innerHTML = `<span class="error">${getT().error}</span>`;
        googleBtn.disabled = false;
      }
    });

    signOutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      window.location.reload();
    });

    closeBtn.addEventListener('click', () => {
      window.close();
      // Fallback if the browser blocks close
      setTimeout(() => {
        if (!window.closed) {
          statusEl.innerHTML = `<span class="note">${getT().closeFallback || 'Puedes cerrar esta pestaña manualmente.'}</span>`;
        }
      }, 300);
    });

    init();
  </script>
</body>
</html>
