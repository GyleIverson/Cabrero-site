<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate como Tester – Cabrero App</title>
  <meta name="description" content="Únete al testing cerrado de Cabrero App. Inicia sesión con Google para registrarte.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .tester-box {
      max-width: 420px;
      margin: 2rem auto;
      padding: 1.5rem;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin: 1rem 0;
    }
    .google-btn:hover { background: #f8f9fa; }
    .status { margin-top: 1rem; font-size: 0.95rem; line-height: 1.4; }
    .success { color: #1b5e20; }
    .error { color: #c62828; }
    .note { font-size: 0.9rem; color: #555; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html"><img src="imagine_images/d5Y8Q.jpg" alt="Cabrero App" class="logo"></a>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="tester-box">
        <h1 data-i18n="testerTitle">Regístrate como Tester</h1>
        <p data-i18n="testerSubtitle">Inicia sesión con Google para unirte al testing cerrado de Cabrero App.</p>
        <p class="note" data-i18n="testerNote">Usaremos el correo de tu cuenta de Google (la misma de tu teléfono Android) para agregarte.</p>

        <button id="googleBtn" class="google-btn" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
          <span data-i18n="googleBtn">Continuar con Google</span>
        </button>

        <div id="status" class="status"></div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== CONFIG — replace these two lines ==========
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    // ======================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const googleBtn = document.getElementById('googleBtn');
    const statusEl = document.getElementById('status');

    const texts = {
      es: {
        testerTitle: "Regístrate como Tester",
        testerSubtitle: "Inicia sesión con Google para unirte al testing cerrado de Cabrero App.",
        testerNote: "Usaremos el correo de tu cuenta de Google (la misma de tu teléfono Android) para agregarte.",
        googleBtn: "Continuar con Google",
        working: "Conectando con Google…",
        success: "¡Listo! Te registramos con el correo<br><strong>{email}</strong><br><br>Te agregaremos al testing de Google Play pronto. Puedes cerrar esta página.",
        already: "Ya estás registrado con<br><strong>{email}</strong>",
        error: "Algo salió mal. Intenta de nuevo o escríbenos por WhatsApp."
      },
      en: {
        testerTitle: "Register as Tester",
        testerSubtitle: "Sign in with Google to join the Cabrero App closed testing.",
        testerNote: "We will use the email from your Google account (the same one on your Android phone) to add you.",
        googleBtn: "Continue with Google",
        working: "Connecting to Google…",
        success: "Done! We registered you with<br><strong>{email}</strong><br><br>We will add you to Google Play testing soon. You can close this page.",
        already: "You are already registered with<br><strong>{email}</strong>",
        error: "Something went wrong. Please try again or contact us on WhatsApp."
      }
    };

    const lang = localStorage.getItem('cabrero-lang') || 'es';
    const t = texts[lang] || texts.es;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });

    async function handleSession(session) {
      if (!session?.user?.email) return false;

      const email = session.user.email;
      const userId = session.user.id;

      // Upsert into beta_testers (create the table first — see recipe)
      const { error } = await supabase
        .from('beta_testers')
        .upsert({
          email,
          user_id: userId,
          source: 'promo-site'
        }, { onConflict: 'email' });

      if (error) {
        console.error(error);
        statusEl.innerHTML = `<span class="error">${t.error}</span>`;
        return false;
      }

      statusEl.innerHTML = `<span class="success">${t.success.replace('{email}', email)}</span>`;
      googleBtn.style.display = 'none';
      return true;
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const ok = await handleSession(session);
        if (ok) return;
      }
      googleBtn.style.display = 'inline-flex';
    }

    googleBtn.addEventListener('click', async () => {
      statusEl.innerHTML = t.working;
      googleBtn.disabled = true;

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/tester.html'
        }
      });

      if (error) {
        statusEl.innerHTML = `<span class="error">${t.error}</span>`;
        googleBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
